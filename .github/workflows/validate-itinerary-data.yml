name: Validate itinerary

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-generated-data:
    name: verify-generated-data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated files
        run: python scripts/generate_route_data.py --check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run UI regression checks
        run: |
          for test in tests/*_regression.py; do
            python "$test" index.html
          done
