name: Validate itinerary source data

on:
  push:
    paths:
      - "data/roteiro.json"
      - "data/route-data.generated.js"
      - "PONTOS-DE-PARADA.md"
      - "index.html"
      - "scripts/generate_route_data.py"
      - "tests/test_itinerary_source_of_truth.py"
      - "tests/test_no_child_specific_ui_copy.py"
      - "tests/mobile_icon_legend_regression.py"
      - "tests/desktop_timeline_layout_regression.py"
      - "tests/stop_order_mobile_regression.py"
      - ".github/workflows/validate-itinerary-data.yml"
  pull_request:
    paths:
      - "data/roteiro.json"
      - "data/route-data.generated.js"
      - "PONTOS-DE-PARADA.md"
      - "index.html"
      - "scripts/generate_route_data.py"
      - "tests/test_itinerary_source_of_truth.py"
      - "tests/test_no_child_specific_ui_copy.py"
      - "tests/mobile_icon_legend_regression.py"
      - "tests/desktop_timeline_layout_regression.py"
      - "tests/stop_order_mobile_regression.py"
      - ".github/workflows/validate-itinerary-data.yml"
  workflow_dispatch:

jobs:
  verify-generated-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/generate_route_data.py --check
      - run: python -m unittest tests/test_itinerary_source_of_truth.py -v
      - run: python -m unittest tests/test_no_child_specific_ui_copy.py -v
      - run: python tests/mobile_icon_legend_regression.py index.html
      - run: python tests/desktop_timeline_layout_regression.py index.html
      - run: python tests/stop_order_mobile_regression.py index.html
